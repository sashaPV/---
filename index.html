<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фитнес-дневник</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<div class="container">
    <h2>🏋️‍♂️ Фитнес-дневник</h2>
    
    <form id="workoutForm">
        <div class="input-group">
            <label>Упражнение:</label>
            <input type="text" id="exName" placeholder="Например: Приседания" required>
        </div>
        
        <div class="input-group">
            <label>Группа мышц:</label>
            <select id="exMuscle">
                <option value="Ноги">Ноги</option>
                <option value="Грудь">Грудь</option>
                <option value="Спина">Спина</option>
            </select>
        </div>
        
        <div class="input-group">
            <label>Подходы и повторения:</label>
            <input type="text" id="exDetails" placeholder="Например: 4 по 12" required>
        </div>
        
        <button type="submit">Добавить упражнение</button>
    </form>

    <div class="filter-group">
        <label>Фильтр по группам мышц:</label>
        <select id="filterSelect">
            <option value="Все">Показать все</option>
            <option value="Ноги">Ноги</option>
            <option value="Грудь">Грудь</option>
            <option value="Спина">Спина</option>
        </select>
    </div>

    <h3>Моя тренировка:</h3>
    <div id="exerciseList"></div>
</div>

</body>
</html>
